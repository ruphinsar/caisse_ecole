.lg{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.lg small{color:var(--mu)}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dn svg{width:150px;height:150px;flex:none}
.dn .lg{flex-direction:column;flex-wrap:nowrap;margin:0}
.note{font-size:12px;color:var(--mu);margin:8px 0 0}
.none{color:var(--mu);font-style:italic;margin:14px 0}
.foot{font-size:12px;color:var(--mu);margin:10px 0 0;border-top:1px solid var(--bd);padding-top:8px}
.tl{margin:0;padding:0;list-style:none;font-size:13px}
.tl li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:4px 0;border-bottom:1px dashed var(--bd)}

,null,"OUI","Respect","CONFORME",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,"OUI","Comparer cahier de retrait et la LBCE affichée dans le bureau","CONFORME",null,null,null,null,null,null,null,null,null,null,null,null,null,"OUI","Assemblée générale à mi-parcours (rapport financier et rapport d'activité), Assemblée générale de bilan","CONFORME",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,"OUI",null,"CONFORME","Oui concorde",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,"NON",null,null,null,"NON",null,null,null,"NON",null,null,null,"NON",null,null,null,"NON",null,null,null,"OUI","OUI","OUI","OUI","OUI","Epp polygone"]]}</script>
<script>
const DATA=JSON.parse(document.getElementById('d').textContent),COLS=DATA.cols,ROWS=DATA.rows;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fp=x=>x.toFixed(1).replace('.',',')+' %';
const EMPTY=['','n/a','na','-','null','vide','nan','none'];
const idx=t=>COLS.findIndex(c=>c.t===t),iD=idx('DREN'),iC=idx('CISCO'),iR=idx('Repondant :');
const TAG={single:'Choix unique',multi:'Choix multiple',bin:'Oui/Non · échelle',text:'Texte libre'};
const ORD=['oui','non','non-verifiable','je ne sais pas','conforme','non conforme','selected','not selected'];
const COL={oui:'var(--pos)',conforme:'var(--pos)',selected:'var(--pos)',non:'var(--neg)','non conforme':'var(--neg)','non-verifiable':'var(--warn)','je ne sais pas':'var(--gry)','not selected':'var(--gry)'};
const colr=(k,i)=>COL[k.toLowerCase()]||'var(--p'+(i%8)+')';
let fD='',fC='',fR='';
function stats(ci,rows){
  const multi=COLS[ci].y==='multi',m=new Map();let valid=0;
  for(const r of rows){const v=r[ci];if(v==null)continue;valid++;
    if(multi){for(const t of new Set(v.split(/[\s,;]+/).filter(Boolean)))m.set(t,(m.get(t)||0)+1)}
    else m.set(v,(m.get(v)||0)+1)}
  return{valid,missing:rows.length-valid,items:[...m].map(([k,n])=>({k,n,p:valid?n/valid*100:0}))};
}
const byN=(a,b)=>b.n-a.n||a.k.localeCompare(b.k,'fr');
const tip=(k,n,p)=>esc(k)+' : n='+n+' ('+fp(p)+')';
function bars(items){return items.map(o=>`<div class="row"><span class="lb" title="${esc(o.k)}">${esc(o.k)}</span><div class="tr"><div class="bf" style="width:${o.p}%" data-tip="${tip(o.k,o.n,o.p)}"></div></div><b>${fp(o.p)}</b></div>`).join('')}
function legend(items){return '<ul class="lg">'+items.map((o,i)=>`<li data-tip="${tip(o.k,o.n,o.p)}"><i style="background:${colr(o.k,i)}"></i>${esc(o.k)} <b>${fp(o.p)}</b> <small>n=${o.n}</small></li>`).join('')+'</ul>'}
function donut(items){
  let cum=0,s='<svg viewBox="0 0 42 42" role="img">';
  items.forEach((o,i)=>{const c=colr(o.k,i);
    s+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${c}" stroke-width="7" stroke-dasharray="${o.p} ${100-o.p}" stroke-dashoffset="${25-cum}" data-tip="${tip(o.k,o.n,o.p)}"/>`;
    if(o.p>=8){const a=(cum+o.p/2)/100*2*Math.PI-Math.PI/2;s+=`<text x="${21+15.9155*Math.cos(a)}" y="${21+15.9155*Math.sin(a)+1.1}" text-anchor="middle" font-size="3.2" font-weight="700" fill="#fff" pointer-events="none">${fp(o.p)}</text>`}
    cum+=o.p});
  return '<div class="dn">'+s+'</svg>'+legend(items)+'</div>';
}
function stacked(items){
  items.sort((a,b)=>{const x=ORD.indexOf(a.k.toLowerCase()),y=ORD.indexOf(b.k.toLowerCase());return(x<0?99:x)-(y<0?99:y)||a.k.localeCompare(b.k,'fr')});
  return '<div class="stk">'+items.map((o,i)=>`<div class="sg" style="width:${o.p}%;background:${colr(o.k,i)}" data-tip="${tip(o.k,o.n,o.p)}">${o.p>=8?fp(o.p):''}</div>`).join('')+'</div>'+legend(items);
}
function render(){
  const rows=ROWS.filter(r=>(!fD||r[iD]===fD)&&(!fC||r[iC]===fC)&&(!fR||r[iR]===fR));
  $('#cnt').innerHTML='<b>'+rows.length+'</b> répondants sur '+ROWS.length;
  let ok=0,tot=0,leak=0;
  COLS.forEach((c,i)=>{
    const el=$('#c'+i),body=el.querySelector('.body'),s=stats(i,rows);
    el.querySelector('.foot').textContent='n = '+s.valid+' réponses valides ('+s.missing+' non-réponses exclues)';
    if(!s.valid){body.innerHTML='<p class="none">Aucune donnée disponible</p>';return}
    if(s.items.some(o=>EMPTY.includes(o.k.trim().toLowerCase())))leak++;
    let h='';
    if(c.y==='text'){
      const it=s.items.sort(byN).slice(0,10);
      h=`<p class="note" style="margin:0 0 6px">${s.valid} réponses non vides · ${s.items.length} valeurs distinctes · 10 plus fréquentes :</p><ol class="tl">`+it.map(o=>`<li data-tip="${tip(o.k.replace(/\s+/g,' '),o.n,o.p)}"><span>${esc(o.k.replace(/\s+/g,' '))}</span><em>${fp(o.p)} · n=${o.n}</em></li>`).join('')+'</ol>';
    }else if(c.y==='multi'){
      h=bars(s.items.sort(byN))+'<p class="note">Plusieurs réponses possibles : le total peut dépasser 100 %. % calculé sur les répondants ayant répondu.</p>';
    }else{
      tot++;if(Math.abs(s.items.reduce((a,o)=>a+o.p,0)-100)<1e-6)ok++;
      h=c.y==='bin'?stacked(s.items):(s.items.length<=5?donut(s.items.sort(byN)):bars(s.items.sort(byN)));
    }
    body.innerHTML=h;
  });
  $('#chk').textContent='Contrôle : somme des % = 100 sur '+ok+'/'+tot+' graphiques à choix unique · valeurs vides exclues : '+(leak?leak+' anomalie(s)':'OK');
}
const uniq=(ci,rs)=>[...new Set(rs.map(r=>r[ci]).filter(v=>v!=null))].sort((a,b)=>a.localeCompare(b,'fr'));
function fill(sel,vals,cur){sel.innerHTML='<option value="">Tous</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');sel.value=vals.includes(cur)?cur:'';return sel.value}
function setC(){fC=fill($('#fC'),uniq(iC,fD?ROWS.filter(r=>r[iD]===fD):ROWS),fC)}
COLS.forEach((c,i)=>{const d=document.createElement('article');d.className='card'+(c.y==='text'?' txt':'');d.id='c'+i;
  d.innerHTML='<h3>'+esc(c.t)+'</h3><div class="tag">'+TAG[c.y]+'</div><div class="body"></div><p class="foot"></p>';$('#grid').append(d)});
fill($('#fD'),uniq(iD,ROWS),'');fill($('#fR'),uniq(iR,ROWS),'');setC();
$('#fD').onchange=e=>{fD=e.target.value;setC();render()};
$('#fC').onchange=e=>{fC=e.target.value;render()};
$('#fR').onchange=e=>{fR=e.target.value;render()};
$('#rs').onclick=()=>{fD=fC=fR='';$('#fD').value='';$('#fR').value='';setC();render()};
$('#ht').onchange=e=>$('#grid').classList.toggle('hide-txt',e.target.checked);
const T=$('#tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){T.style.display='none';return}
  T.textContent=t.getAttribute('data-tip').replace(/&amp;/g,'&');T.style.display='block';
  T.style.left=Math.min(e.clientX+12,innerWidth-290)+'px';T.style.top=(e.clientY+14)+'px'});
render();
</script>
